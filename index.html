<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link-in-Bio Maker | Ajmeer Khan Hacker King</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--panel:#0b0e1f;--line:#1c2240;--cyan:#3df5ff;--red:#ff3d6e;--gold:#f5c76a;--txt:#e8ecff;--mut:#8a93bd}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 80% -10%,#2a0a1c 0,transparent 60%),radial-gradient(800px 500px at 0 0,#06222b 0,transparent 55%),var(--bg);color:var(--txt);font-family:Rajdhani,system-ui,sans-serif;font-weight:500;font-size:17px;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
header svg{width:64px;height:64px;flex:none;filter:drop-shadow(0 0 12px #ff3d6e88)}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(15px,3.6vw,22px);letter-spacing:.04em;color:var(--gold)}
header p{color:var(--mut);font-size:15px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;max-width:1040px;margin:0 auto;padding:20px}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-family:Orbitron,sans-serif;font-size:14px;color:var(--cyan);margin-bottom:12px}
label{display:block;color:var(--mut);font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;background:#070918;border:1px solid var(--line);border-radius:9px;color:var(--txt);font:inherit;padding:10px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
textarea{resize:vertical;min-height:60px}
.row{display:grid;grid-template-columns:118px 1fr 40px;gap:8px;margin-bottom:10px}
.row .v{grid-column:1/-1}
.row input.l{grid-column:2}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:#12162e;color:var(--txt);padding:10px 14px}
button:hover{border-color:var(--cyan)}
.del{padding:0;color:var(--red)}
.pri{background:linear-gradient(90deg,var(--red),#ff7a3d);border:0;color:#fff}
.cy{background:var(--cyan);border:0;color:#02131a}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts button{flex:1 1 140px}
.themes{display:flex;gap:10px}
.themes button{width:42px;height:42px;border-radius:50%;padding:0;border:3px solid transparent}
.themes button.on{border-color:#fff}
.photo{display:flex;gap:10px;align-items:center}
.photo input{padding:7px}
.phone{position:sticky;top:14px;width:320px;height:600px;margin:0 auto;border:8px solid #1a1f3d;border-radius:34px;overflow:hidden;background:#000;box-shadow:0 0 40px #ff3d6e33}
.phone iframe{width:100%;height:100%;border:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--gold);color:#1a1200;font-weight:700;padding:10px 18px;border-radius:30px;transition:transform .25s}
#toast.show{transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
<div id="logo"></div>
<div><h1>AJMEER KHAN HACKER KING</h1><p>Link-in-Bio Maker. Add your links, download your page.</p></div>
</header>
<main>
<div>
<section>
<h2>Your profile</h2>
<label for="name">Name</label><input id="name" maxlength="40">
<label for="bio">Bio</label><textarea id="bio" maxlength="140"></textarea>
<label for="photo">Photo (optional, the skull king shows if empty)</label>
<div class="photo"><input id="photo" type="file" accept="image/*"><button id="rmPhoto" type="button">Remove</button></div>
</section>
<section>
<h2>Your links</h2>
<div id="links"></div>
<button id="add" type="button" class="cy">+ Add link</button>
</section>
<section>
<h2>Colour</h2>
<div class="themes" id="themes"></div>
</section>
<section>
<h2>Get your page</h2>
<div class="acts">
<button id="dl" type="button" class="pri">Download page (.html)</button>
<button id="cp" type="button">Copy code</button>
</div>
<p style="color:var(--mut);font-size:14px;margin-top:10px">Upload the downloaded file to any free host (Netlify, GitHub Pages) and share that link in your bio.</p>
</section>
</div>
<div><div class="phone"><iframe id="pv" title="Live preview"></iframe></div></div>
</main>
<div id="toast" role="status"></div>
<script>
const SKULL=`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="g" cx="50%" cy="45%"><stop offset="0" stop-color="#ff3d6e" stop-opacity=".55"/><stop offset="1" stop-color="#ff3d6e" stop-opacity="0"/></radialGradient><linearGradient id="f" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3d6e"/><stop offset=".6" stop-color="#ff8a3d"/><stop offset="1" stop-color="#f5c76a"/></linearGradient></defs><circle cx="100" cy="100" r="98" fill="url(#g)"/><path d="M18 200C18 125 55 70 100 70s82 55 82 130z" fill="#0a0d1c" stroke="#3df5ff" stroke-width="2.5"/><path d="M38 100Q26 58 52 34Q50 62 68 54Q66 22 98 4Q98 40 122 46Q140 18 152 36Q170 62 162 100Q150 78 140 84Q130 62 100 62Q70 62 60 84Q50 76 38 100Z" fill="url(#f)"/><path d="M63 88a37 40 0 0 1 74 0v28q0 11-11 15v16H74v-16q-11-4-11-15z" fill="#eceff9"/><path d="M68 96l26 9-7 17-19-8z" fill="#ff3d6e" stroke="#7a0a26" stroke-width="2"/><path d="M132 96l-26 9 7 17 19-8z" fill="#3df5ff" stroke="#06606a" stroke-width="2"/><path d="M100 122l-6 11h12z" fill="#0a0d1c"/><path d="M78 146h44" stroke="#0a0d1c" stroke-width="2.5"/><path d="M84 146v14M92 146v16M100 146v16M108 146v16M116 146v14" stroke="#0a0d1c" stroke-width="2.5"/><path d="M66 70l9-30 12 17 13-28 13 28 12-17 9 30z" fill="#f5c76a" stroke="#8a6a1a" stroke-width="2"/><circle cx="100" cy="62" r="3.5" fill="#ff3d6e"/><path d="M40 150l22 10M160 150l-22 10M30 172l28 6M170 172l-28 6" stroke="#ff3d6e" stroke-width="3" stroke-linecap="round"/></svg>`;
document.getElementById('logo').innerHTML=SKULL;

const THEMES={cyan:'#3df5ff',crimson:'#ff3d6e',gold:'#f5c76a',matrix:'#3dff8a'};
const TYPES={
 whatsapp:{n:'WhatsApp',i:'💬',p:'923001234567',pre:v=>'https://wa.me/'+v.replace(/\D/g,'')},
 instagram:{n:'Instagram',i:'📸',p:'username',pre:v=>'https://instagram.com/'+v.replace('@','')},
 youtube:{n:'YouTube',i:'▶️',p:'channel link',pre:v=>'https://'+v},
 facebook:{n:'Facebook',i:'👍',p:'profile link or name',pre:v=>'https://facebook.com/'+v},
 tiktok:{n:'TikTok',i:'🎵',p:'username',pre:v=>'https://tiktok.com/@'+v.replace('@','')},
 telegram:{n:'Telegram',i:'✈️',p:'username',pre:v=>'https://t.me/'+v.replace('@','')},
 call:{n:'Call me',i:'📞',p:'+923001234567',pre:v=>'tel:'+v.replace(/\s/g,'')},
 email:{n:'Email',i:'✉️',p:'you@email.com',pre:v=>'mailto:'+v},
 website:{n:'Website',i:'🌐',p:'yoursite.com',pre:v=>'https://'+v}
};
const S={name:'Ajmeer Khan Hacker King',bio:'Hacker. Tool builder. Digital king.',photo:'',theme:'cyan',
 links:[{t:'whatsapp',l:'Chat on WhatsApp',v:'923001234567'},{t:'instagram',l:'Follow on Instagram',v:'ajmeerkhan'},{t:'youtube',l:'Watch on YouTube',v:'youtube.com'}]};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function href(k){const v=k.v.trim();return /^(https?:|tel:|mailto:)/i.test(v)?v:TYPES[k.t].pre(v)}

function build(){
 const c=THEMES[S.theme];
 const items=S.links.filter(k=>k.v.trim()).map(k=>`<a class="b" href="${esc(href(k))}" target="_blank" rel="noopener"><i>${TYPES[k.t].i}</i><span>${esc(k.l.trim()||TYPES[k.t].n)}</span></a>`).join('');
 const av=S.photo?`<img src="${S.photo}" alt="">`:SKULL;
 return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.name)}</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}:root{--c:${c}}
body{min-height:100vh;background:radial-gradient(500px 300px at 50% 0,#3a0b1e 0,transparent 70%),#05060f;color:#e8ecff;font-family:Rajdhani,system-ui,sans-serif;font-weight:600;display:flex;justify-content:center;padding:34px 18px}
.w{width:100%;max-width:420px;text-align:center}
.av{width:132px;height:132px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 28px var(--c);overflow:hidden;background:#0a0d1c}
.av svg,.av img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:21px;letter-spacing:.03em;color:#f5c76a}
p{color:#9aa3cc;margin:8px 0 26px;font-size:18px}
.b{display:flex;align-items:center;gap:14px;background:#0b0e1f;border:1.5px solid var(--c);color:#fff;text-decoration:none;border-radius:14px;padding:15px 18px;margin-bottom:13px;font-size:19px;font-weight:700;transition:transform .15s,box-shadow .15s}
.b:hover,.b:focus-visible{transform:translateY(-2px);box-shadow:0 0 18px var(--c);outline:0}
.b i{font-style:normal;font-size:24px}.b span{flex:1;text-align:left}
footer{margin-top:30px;font-size:13px;color:#5b6490}
@media(prefers-reduced-motion:reduce){.b{transition:none}}</style></head>
<body><div class="w"><div class="av">${av}</div><h1>${esc(S.name)}</h1><p>${esc(S.bio)}</p>${items}<footer>Made with Ajmeer Khan Hacker King</footer></div></body></html>`;
}

const $=id=>document.getElementById(id);
function render(){$('pv').srcdoc=build()}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

function drawLinks(){
 $('links').innerHTML=S.links.map((k,i)=>`<div class="row">
 <select data-i="${i}" data-f="t" aria-label="Type">${Object.keys(TYPES).map(x=>`<option value="${x}"${x===k.t?' selected':''}>${TYPES[x].n}</option>`).join('')}</select>
 <input class="l" data-i="${i}" data-f="l" value="${esc(k.l)}" placeholder="Button text" aria-label="Button text">
 <button type="button" class="del" data-d="${i}" aria-label="Delete link">✕</button>
 <input class="v" data-i="${i}" data-f="v" value="${esc(k.v)}" placeholder="${TYPES[k.t].p}" aria-label="Link or username"></div>`).join('');
}
// Update only the row whose platform was changed; keep all other rows untouched.
const DEFAULT_LABELS={
 whatsapp:'Chat on WhatsApp',
 instagram:'Follow on Instagram',
 youtube:'Watch on YouTube',
 facebook:'Visit Facebook',
 tiktok:'Follow on TikTok',
 telegram:'Join on Telegram',
 call:'Call me',
 email:'Email me',
 website:'Visit Website'
};
$('links').addEventListener('input',e=>{
 const i=e.target.dataset.i;
 if(i===undefined)return;
 const f=e.target.dataset.f;
 if(f==='t')return;
 S.links[i][f]=e.target.value;
 render();
});
$('links').addEventListener('change',e=>{
 const i=e.target.dataset.i;
 if(i===undefined||e.target.dataset.f!=='t')return;
 const selectedType=e.target.value;
 S.links[i].t=selectedType;
 S.links[i].l=DEFAULT_LABELS[selectedType]||TYPES[selectedType].n;
 drawLinks();
 render();
});
$('links').addEventListener('click',e=>{const d=e.target.dataset.d;if(d===undefined)return;S.links.splice(d,1);drawLinks();render()});
$('add').onclick=()=>{S.links.push({t:'website',l:'',v:''});drawLinks();render()};

$('name').value=S.name;$('bio').value=S.bio;
$('name').oninput=e=>{S.name=e.target.value;render()};
$('bio').oninput=e=>{S.bio=e.target.value;render()};
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const s=260,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);S.photo=c.toDataURL('image/jpeg',.82);render()};im.src=r.result};r.readAsDataURL(f)};
$('rmPhoto').onclick=()=>{S.photo='';$('photo').value='';render()};

$('themes').innerHTML=Object.keys(THEMES).map(k=>`<button type="button" data-th="${k}" aria-label="${k}" style="background:${THEMES[k]}"></button>`).join('');
function drawThemes(){[...$('themes').children].forEach(b=>b.classList.toggle('on',b.dataset.th===S.theme))}
$('themes').onclick=e=>{const t=e.target.dataset.th;if(!t)return;S.theme=t;drawThemes();render()};

$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([build()],{type:'text/html'}));a.download='link-in-bio.html';a.click();toast('Page downloaded')};
$('cp').onclick=async()=>{const h=build();try{await navigator.clipboard.writeText(h)}catch(_){const t=document.createElement('textarea');t.value=h;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast('Code copied')};

drawLinks();drawThemes();render();
</script>
</body>
</html>
